<!DOCTYPE html>
<html lang="pt-BR">
<head>

</head>
<body>

      </div>
    </aside>
    <div class="main">
      <div class="topbar"><button class="icon-btn" id="toggle-nav" aria-label="Abrir menu">☰</button><strong>GM Elcons Catalog</strong></div>

  <dialog id="modal"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <script src="/js/app.js"></script>
