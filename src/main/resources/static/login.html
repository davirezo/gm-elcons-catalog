<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - GM Elcons Catalog</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="logo">GM</span><span>GM Elcons Catalog<small>Cadastro técnico e anúncios</small></span></div>
      <form id="login-form" autocomplete="on">
        <div class="field"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div class="form-error" id="login-error" role="alert"></div>
        <button class="btn primary" type="submit" id="login-btn" style="justify-content:center">Entrar</button>
      </form>
      <p class="muted small" style="margin:16px 0 0">Acesso restrito a usuários autorizados. As operações são registradas em auditoria.</p>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
