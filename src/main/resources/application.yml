spring:
  application:
    name: gm-elcons-catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gmelcons}
    username: ${DB_USER:gmelcons}
    # Sem valor padrão de propósito: a aplicação não sobe sem DB_PASSWORD definida.
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  seed:
    # Em produção use APP_SEED_DEMO=false e defina APP_ADMIN_PASSWORD.
    demo-data: ${APP_SEED_DEMO:true}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
    operator-password: ${APP_DEMO_OPERATOR_PASSWORD:}
